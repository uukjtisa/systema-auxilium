[pytest]
# Systema Auxilium test suite. Tests live under tests/ and mirror the
# systema/ package layout (tests/systema/<subpkg>/test_<module>.py).
#
# importlib import mode lets identically named test files coexist across the
# mirrored tree without __init__.py packages. pythonpath = . makes the
# `systema` package importable without an install step (CI-friendly).
minversion = 7.0
addopts = -ra -q --import-mode=importlib
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
