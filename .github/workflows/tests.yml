name: tests

# Run the pytest suite on every push and pull request.
on:
  push:
    branches: [main, unstable]
  pull_request:
    branches: [main, unstable]
  workflow_dispatch:   # lets you trigger it by hand from the Actions tab

# Pushing main and unstable back to back used to start two full runs. Supersede
# the older one instead of paying for both.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite finishes in ~2 minutes. Without this ceiling a stuck step runs
    # until GitHub's 6-hour default job limit kills it -- which is exactly what
    # happened on 2026-08-19, when the apt mirror went dark and run #60 burned
    # 6h 1m on `apt-get update` before being cancelled.
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # PyQt6 runs headless via the "offscreen" platform plugin, but it still
      # needs a few native libraries present. libportaudio2 is here so the voice
      # modules import cleanly if a test ever pulls them in.
      #
      # apt has no wall-clock ceiling of its own: when azure.archive.ubuntu.com
      # is unreachable it retries every source forever. So each attempt gets
      # hard socket timeouts, and a failed attempt falls back off the Azure
      # mirror onto archive.ubuntu.com before retrying.
      - name: Install system libraries (Qt offscreen + audio)
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          APT_OPTS='-o Acquire::Retries=3
                    -o Acquire::http::Timeout=15
                    -o Acquire::https::Timeout=15
                    -o Acquire::ftp::Timeout=15'

          drop_azure_mirror() {
            echo "::warning::apt failed against the default mirror - falling back to archive.ubuntu.com"
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
              /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          }

          # shellcheck disable=SC2086
          sudo apt-get $APT_OPTS update || { drop_azure_mirror; sudo apt-get $APT_OPTS update; }

          # shellcheck disable=SC2086
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libportaudio2

      - name: Install Python dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install --retries 3 --timeout 30 -r requirements.txt
          pip install --retries 3 --timeout 30 pytest

      - name: Run the test suite
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
