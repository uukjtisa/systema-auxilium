name: tests

# Run the pytest suite on every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:   # lets you trigger it by hand from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # PyQt6 runs headless via the "offscreen" platform plugin, but it still
      # needs a few native libraries present. libportaudio2 is here so the voice
      # modules import cleanly if a test ever pulls them in.
      - name: Install system libraries (Qt offscreen + audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libportaudio2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
